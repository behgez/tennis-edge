<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f172a" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<title>TennisEdge</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background:#0f172a;color:#94a3b8;font-family:-apple-system,sans-serif">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			function showErr(msg) {
				document.body.innerHTML = '<div style="padding:20px;max-width:600px;margin:40px auto"><h2 style="color:#f87171">Error</h2><pre style="white-space:pre-wrap;font-size:12px;color:#cbd5e1;background:#1e293b;padding:12px;border-radius:8px">' + msg + '</pre><p style="margin-top:16px"><a href="/tennis-edge/" style="color:#ccff00">Go Home</a> · <a href="javascript:location.reload()" style="color:#ccff00;margin-left:8px">Retry</a></p></div>';
			}
			window.onerror = function(msg, src, line) { showErr(msg + '\n' + src + ':' + line); };
			window.addEventListener('unhandledrejection', function(e) { showErr('Promise: ' + (e.reason?.message || e.reason || 'Unknown error') + '\n' + (e.reason?.stack || '')); });
		</script>
	</body>
</html>
